name: Tests

# Valide les tests avant de fusionner ou de tagger une version (v*).
# Le job s'appelle `test` : c'est le contexte exigé par le ruleset « Protection de la branche par défaut ».
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests (net461 et net10.0)
        run: dotnet test JBOpale.MathAdvanced.sln --configuration Release
