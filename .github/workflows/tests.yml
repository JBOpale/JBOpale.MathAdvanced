name: JBOpale.MathAdvanced - Tests

# Valide les tests après chaque push sur main.
# Les tests des pull requests sont lancés par pr-tests.yml (check requis « JBOpale.MathAdvanced - Tests PR ») :
# le déclencheur pull_request a été retiré ici pour éviter les doubles exécutions.
on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests (net461 et net10.0)
        run: dotnet test JBOpale.MathAdvanced.sln --configuration Release
