name: JBOpale.MathAdvanced - Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  # La publication est bloquée tant que tous les tests ne passent pas, sur net461 et net10.0.
  test:
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests (net461 et net10.0)
        run: dotnet test JBOpale.MathAdvanced.sln --configuration Release

  publish:
    needs: test
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]
    # Trusted Publishing : id-token: write permet l'échange OIDC contre une clé NuGet temporaire.
    # Aucun secret NUGET_API_KEY n'est utilisé.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer le SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack NuGet
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet pack JBOpale.MathAdvanced/JBOpale.MathAdvanced.csproj --configuration Release -p:Version=$version --output nupkg

      - name: Vérifier le contenu du package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $pkg = Get-ChildItem -Path nupkg -Filter *.nupkg | Select-Object -First 1
          $zip = [System.IO.Compression.ZipFile]::OpenRead($pkg.FullName)
          $names = $zip.Entries | ForEach-Object { $_.FullName }
          $zip.Dispose()
          Write-Host "Contenu du package :"; $names | ForEach-Object { Write-Host "  $_" }
          foreach ($attendu in 'lib/net461/JBOpale.MathAdvanced.dll', 'lib/net10.0/JBOpale.MathAdvanced.dll', 'skills/jbopale-mathadvanced/SKILL.md', 'README.md', 'LICENSE', 'icon.png') {
            if ($names -notcontains $attendu) { throw "Fichier manquant dans le package : $attendu" }
          }

      # Trusted Publishing : jeton OIDC éphémère échangé contre une clé temporaire.
      # `user` est le nom de profil du compte NuGet qui a créé la politique (pas l'organisation propriétaire).
      - name: Connexion à NuGet (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: Kolth

      - name: Push to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $pkg = Get-ChildItem -Path nupkg -Filter *.nupkg | Select-Object -First 1
          dotnet nuget push $pkg.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
