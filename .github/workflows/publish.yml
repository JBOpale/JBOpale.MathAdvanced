name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: [self-hosted, Windows, SURFACE-BOOK-3]
    # Les steps ci-dessous utilisent une syntaxe bash (expansion de paramètres,
    # continuations par \) — le shell par défaut sur ce runner Windows est
    # PowerShell, donc on force bash pour tout le job plutôt que step par step.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Contournement : 'bash' résout par défaut vers le stub WSL de
      # C:\WINDOWS\System32 (aucune distribution installée, échec immédiat)
      # plutôt que Git Bash sur ce runner — Git\cmd est dans le PATH mais pas
      # Git\bin (qui contient bash.exe). Prépendre Git\bin corrige la
      # résolution pour tous les steps `shell: bash` qui suivent.
      - name: Configure PATH for Git Bash (contournement résolution WSL)
        shell: pwsh
        run: '"C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      # Contournement permissions runner (Program Files non accessible en
      # écriture selon l'état du service actions-runner) — voir Vigie/CLAUDE.md.
      - name: Configure dotnet install directory (contournement permissions runner)
        shell: pwsh
        run: echo "DOTNET_INSTALL_DIR=$env:LOCALAPPDATA\dotnet" >> $env:GITHUB_ENV

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extraire la version depuis le tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}

      # Garde-fou : tous les tests (net461 et net10.0) doivent passer. En cas
      # d'échec, le job s'arrête ici et ni Pack ni Push ne sont exécutés.
      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack MathAdvanced/MathAdvanced.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkgs \
            /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
